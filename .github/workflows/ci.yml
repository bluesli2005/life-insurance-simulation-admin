name: Checks and coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:5.7.44
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: laravel_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: testing
      DB_HOST: 127.0.0.1
      DB_DATABASE: laravel_testing
      DB_USERNAME: root
      DB_PASSWORD: root
      CYPRESS_INSTALL_BINARY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 14.21.3
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mbstring, pdo_mysql, dom, xml
          coverage: pcov
          ini-values: pcov.directory=${{ github.workspace }}/backend/app
          tools: composer:v2.2
      - name: Install locked dependencies
        run: |
          npm ci --prefix frontend --no-audit --no-fund
          composer install --working-dir=backend --no-interaction --prefer-dist --no-progress
          cp backend/.env.example backend/.env
          cd backend
          php artisan key:generate
      - name: Typecheck and frontend/backend tests
        run: bash scripts/check.sh
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: |
            frontend/coverage/
            backend/coverage/
            coverage/summary.md
          retention-days: 14
      - name: Show coverage in pull request
        if: >-
          ${{ always() && github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name == github.repository &&
              github.actor != 'dependabot[bot]' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ci-coverage-summary -->';
            const path = 'coverage/summary.md';
            const summary = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8').trim()
              : 'Coverage report was not generated for this run.';
            const body = `${marker}\n${summary}\n\n[Full report and CI logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const previous = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: previous.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }
