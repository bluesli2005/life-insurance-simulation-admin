name: life-insurance-separated
services:
  backend:
    build:
      context: ./backend
    platform: linux/amd64
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8001
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:8081}
      SESSION_COOKIE: life_insurance_separated_session
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: laravel
      DB_USERNAME: root
      DB_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        MIX_API_BASE_URL: ${MIX_API_BASE_URL:-}
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
  mysql:
    image: mysql:5.7.44
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
    volumes:
      - mysql57_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mysql57_data:
